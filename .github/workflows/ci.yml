name: ci

# Everything here runs WITHOUT an API key. The tests that matter - the eval
# gate, the judge's determinism, the fix ladder, the tool audit, cache
# invalidation - are all offline by design, because a test suite that needs a
# paid provider is one nobody runs.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest pyflakes

      - name: Lint
        run: python -m pyflakes forgeai/ scripts/ tests/

      - name: Tests
        run: python -m pytest tests/ -q

      - name: Audit committed artifacts
        # Reads the run directories and checks them against the assignment.
        # Non-zero exit means a core requirement has no evidence behind it.
        run: python scripts/audit.py

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npx next build --no-lint
