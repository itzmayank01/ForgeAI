[project]
name = "forgeai"
version = "0.1.0"
description = "ForgeAI - the agent that builds agents. Brief + documents -> tested, self-improving RAG agent."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "typer>=0.12",
    "rich>=13.7",
    "pypdf>=5.0",
    "pandas>=2.2",
    "numpy>=1.26",
    "sentence-transformers>=3.0",
    "rank-bm25>=0.2.2",
    "streamlit>=1.39",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[project.scripts]
forgeai = "forgeai.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["forgeai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
